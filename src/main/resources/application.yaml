spring:
  application:
    name: spring-security-demo
  ldap:
    urls: ${LDAP_URL:ldap://localhost:8389}
    base: ${LDAP_BASE:dc=example,dc=org}
    username: ${LDAP_ADMIN_DN:cn=admin,dc=example,dc=org}
    password: ${LDAP_ADMIN_PASSWORD}
  security:
    saml2:
      relyingparty:
        registration:
          test-oauth:
            signing:
              credentials:
                - private-key-location: ${SAML_SP_PRIVATE_KEY:file:./local-secrets/rp.key}
                  certificate-location: ${SAML_SP_CERTIFICATE:file:./local-secrets/rp.crt}
            assertingparty:
              metadata-uri: ${KEYCLOAK_BASE_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:test-oauth}/protocol/saml/descriptor
    oauth2:
      resourceserver:
        test-oauth:
          issuer-uri: ${KEYCLOAK_BASE_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:test-oauth}
          introspection-uri: ${KEYCLOAK_BASE_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:test-oauth}/protocol/openid-connect/token/introspect
          client-id: ${KEYCLOAK_CLIENT_ID:demo-api}
          client-secret: ${KEYCLOAK_CLIENT_SECRET}
      client:
        provider:
          test-oauth:
            issuer-uri: ${KEYCLOAK_BASE_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:test-oauth}
            token-uri: ${KEYCLOAK_BASE_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:test-oauth}/protocol/openid-connect/token
            user-info-uri: ${KEYCLOAK_BASE_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:test-oauth}/protocol/openid-connect/userinfo
            logout-uri: ${KEYCLOAK_BASE_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:test-oauth}/protocol/openid-connect/logout
        registration:
          test-oauth:
            provider: test-oauth
            client-id: ${KEYCLOAK_CLIENT_ID:demo-api}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/test-oauth"
            scope: openid,profile,email
            authorization-grant-type: authorization_code

logging:
  level:
    org.springframework.security: INFO
    org.springframework.security.saml2: INFO
    org.opensaml: INFO

server:
  port: ${SERVER_PORT:8081}

app:
  redirect:
    login-url: ${APP_LOGIN_URL:http://localhost:8081/user/userInfo}
